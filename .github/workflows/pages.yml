name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Rebuild the demo data from Database/photosportData.sql so it never drifts
      - name: Build demo data
        run: node scripts/build-demo-seed.js

      # Only the static site is published (no server code, SQL or node_modules)
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html .nojekyll Pages Assets _site/
          rm -f _site/Assets/JS/conexion.js _site/Assets/JS/package*.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
